<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ルートランナー">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1418">
<title>ルートランナー</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- タイトル（起動したときだけ） -->
<div id="title" class="hidden">
  <canvas id="titleCv"></canvas>
  <div class="tlogo"><h1>ルートランナー</h1><p>走って、拾って、鍛える</p></div>
  <div class="ttap" id="titleTap">タップしてはじめる</div>
  <div class="tver" id="titleVer"></div>
</div>

<!-- 拠点 -->
<div id="base">
  <div class="top">
    <h1>ルートランナー</h1>
    <div class="topr">
      <div class="meta"><span class="gold" id="bGold"></span><small id="bBest"></small></div>
      <button class="small icob" id="setBtn" aria-label="設定を開く"></button>
    </div>
  </div>

  <!-- 拠点タブ：村の絵・次の目標・出撃・やり込み -->
  <section class="tab" id="tabHome">
    <div class="camp">
      <canvas id="campCv" aria-label="拠点の村。建物をタップすると施設が開く"></canvas>
      <div class="camptag" id="campTag"></div>
      <div class="camppow"><small>戦力</small><b id="campPow"></b></div>
    </div>
    <button class="primary go" id="goBtn">出撃する<small id="goSub"></small></button>
    <button class="goal" id="goal"></button>
    <div class="hub">
      <button id="dailyBtn"><i data-ic="daily"></i><b>日替わり</b><small id="dailySub"></small></button>
      <button id="facBtn"><i data-ic="home"></i><b>施設</b><small id="facSub"></small></button>
      <button id="achBtn"><i data-ic="trophy"></i><b>実績</b><small id="achSub"></small><span class="badge" id="achBadge"></span></button>
      <button id="recBtn"><i data-ic="book"></i><b>記録</b><small>統計</small></button>
    </div>
  </section>

  <!-- 装備タブ -->
  <section class="tab hidden" id="tabGear">
    <div class="card">
      <div class="powerrow"><span style="color:var(--muted);font-size:12px">戦力</span><span class="power" id="bPower"></span></div>
      <div class="stats" id="bStats"></div>
      <p class="roles">装備＝本体の強さ。ボスを削る主力と、耐える力。<br>スキル（出撃中にレベルアップで選ぶ）＝群れを倒す力。ボスにも効く（雑魚よりは効きにくい）。</p>
    </div>
    <div class="card">
      <h2><span>装備</span><button class="small" id="codexBtn">図鑑</button></h2>
      <div id="bEquip"></div>
      <div id="bSets"></div>
    </div>
  </section>

  <!-- 所持品タブ -->
  <section class="tab hidden" id="tabBag">
  <div class="card">
    <h2><span id="bInvTitle">所持品</span><button class="small" id="expandBtn">枠を増やす</button></h2>
    <div class="mats" id="bMats" aria-label="素材"></div>
    <div class="invtools three">
      <select id="fSlot" aria-label="部位で絞り込み">
        <option value="all">部位：全部</option>
        <option value="weapon">武器</option>
        <option value="head">頭</option>
        <option value="body">胴</option>
        <option value="charm">装飾</option>
      </select>
      <select id="fRar" aria-label="レア度で絞り込み">
        <option value="0">レア度：全部</option>
        <option value="1">アンコモン↑</option>
        <option value="2">レア↑</option>
        <option value="3">エピック↑</option>
        <option value="4">レジェンド</option>
      </select>
      <select id="sortSel" aria-label="並び替え">
        <option value="power">戦力が上がる順</option>
        <option value="rarity">レア度順</option>
        <option value="ilvl">アイテムLv順</option>
        <option value="slot">部位順</option>
        <option value="new">新しい順</option>
      </select>
    </div>
    <div class="invtools">
      <button class="small" id="bulkBtn">まとめて分解</button>
      <label class="autolbl" for="autoSel">自動分解</label>
      <select id="autoSel" aria-label="拾ったときに自動分解">
        <option value="-1">しない</option>
        <option value="0">コモン</option>
        <option value="1">アンコモン以下</option>
        <option value="2">レア以下</option>
      </select>
    </div>
    <div id="bInv"></div>
  </div>
  </section>
</div>
<nav class="tabbar" id="tabbar" aria-label="拠点の画面">
  <button data-tab="tabHome" class="on" aria-pressed="true"><i data-ic="home"></i>拠点</button>
  <button data-tab="tabGear" aria-pressed="false"><i data-ic="sword"></i>装備<span class="badge" id="gearBadge"></span></button>
  <button data-tab="tabBag" aria-pressed="false"><i data-ic="bag"></i>所持品<span class="badge" id="bagBadge"></span></button>
</nav>

<!-- 冒険 -->
<div id="run" class="hidden">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="feed" aria-live="polite"></div>
  </div>
  <div class="runbar">
    <span class="tip">タップでジャンプ（長押しで高く・2段まで）</span>
    <div class="runbtns">
      <button class="small" id="muteBtn" aria-pressed="false">音 ON</button>
      <button class="small" id="pauseBtn">一時停止</button>
    </div>
  </div>
</div>

<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
<div id="dialog" class="hidden"><div class="dcard" id="dcard"></div></div>
<div id="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
