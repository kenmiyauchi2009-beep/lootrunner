<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ルートランナー">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1418">
<title>ルートランナー 試作</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 拠点 -->
<div id="base">
  <div class="top">
    <h1>ルートランナー <small style="color:var(--muted);font-weight:400">試作</small></h1>
    <div class="topr">
      <div class="meta"><span class="gold" id="bGold"></span><small id="bBest"></small></div>
      <button class="small" id="setBtn" aria-label="設定を開く">設定</button>
    </div>
  </div>
  <button class="primary go" id="goBtn">出撃する</button>
  <div class="card">
    <div class="powerrow"><span style="color:var(--muted);font-size:12px">戦力</span><span class="power" id="bPower"></span></div>
    <div class="stats" id="bStats"></div>
    <p class="roles">装備＝ボスを倒す力と耐える力（ボスにはスキルが効かない）。<br>スキル（出撃中にレベルアップで選ぶ）＝群れを倒す力。</p>
  </div>
  <div class="card">
    <h2><span>装備</span><button class="small" id="codexBtn">図鑑</button></h2>
    <div id="bEquip"></div>
    <div id="bSets"></div>
  </div>
  <div class="card">
    <h2><span id="bInvTitle">所持品</span><button class="small" id="expandBtn">枠を増やす</button></h2>
    <div class="mats" id="bMats" aria-label="素材"></div>
    <div class="invtools">
      <select id="fSlot" aria-label="部位で絞り込み">
        <option value="all">部位：すべて</option>
        <option value="weapon">武器</option>
        <option value="head">頭</option>
        <option value="body">胴</option>
        <option value="charm">装飾</option>
      </select>
      <select id="fRar" aria-label="レア度で絞り込み">
        <option value="0">レア度：すべて</option>
        <option value="1">アンコモン以上</option>
        <option value="2">レア以上</option>
        <option value="3">エピック以上</option>
        <option value="4">レジェンド</option>
      </select>
    </div>
    <div class="invtools">
      <select id="sortSel" aria-label="並び替え">
        <option value="power">並び：戦力が上がる順</option>
        <option value="rarity">並び：レア度順</option>
        <option value="ilvl">並び：アイテムLv順</option>
        <option value="slot">並び：部位順</option>
        <option value="new">並び：新しい順</option>
      </select>
      <button class="small" id="bulkBtn">まとめて分解</button>
    </div>
    <div class="invtools">
      <label class="autolbl" for="autoSel">拾ったときに自動分解</label>
      <select id="autoSel">
        <option value="-1">しない</option>
        <option value="0">コモン</option>
        <option value="1">アンコモン以下</option>
        <option value="2">レア以下</option>
      </select>
    </div>
    <div id="bInv"></div>
  </div>
</div>

<!-- 冒険 -->
<div id="run" class="hidden">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="feed" aria-live="polite"></div>
  </div>
  <div class="runbar">
    <span class="tip">タップでジャンプ（長押しで高く・2段まで）</span>
    <div class="runbtns">
      <button class="small" id="muteBtn" aria-pressed="false">音 ON</button>
      <button class="small" id="pauseBtn">一時停止</button>
    </div>
  </div>
</div>

<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
<div id="dialog" class="hidden"><div class="dcard" id="dcard"></div></div>
<div id="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
