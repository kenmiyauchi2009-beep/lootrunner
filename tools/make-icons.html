<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アイコン生成</title>
<style>
  body{margin:0;padding:16px;background:#0e1418;color:#e3eef0;font-family:-apple-system,"Hiragino Sans",sans-serif}
  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
  figure{margin:0;text-align:center;font-size:12px}
  canvas{display:block;background:#000;margin-bottom:6px;max-width:100%}
  .mask canvas{border-radius:22%}
  a{color:#ffb547}
</style>
</head>
<body>
<h1 style="font-size:16px">ルートランナー アイコン生成</h1>
<p style="font-size:13px;color:#8aa1a8">絵は icon-art.js。各リンクから PNG を保存して icons/ に置く（localhost で開くこと）。</p>
<div class="row" id="row"></div>
<script type="module">
import { drawIcon } from './icon-art.js';
const row = document.getElementById('row');
for (const size of [180, 192, 512]){
  const cv = document.createElement('canvas');
  cv.width = cv.height = size; cv.id = 'icon-' + size;
  drawIcon(cv.getContext('2d'), size);
  const fig = document.createElement('figure');
  fig.className = size === 180 ? 'mask' : '';
  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png'); a.download = `icon-${size}.png`; a.textContent = `icon-${size}.png を保存`;
  cv.style.width = Math.min(size, 256) + 'px';
  fig.append(cv, a); row.append(fig);
}
window.ICONS_READY = true;
</script>
</body>
</html>
